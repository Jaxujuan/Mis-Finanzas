<script>
/* =========================================================
   Components.html
   Utilidades de formato, íconos y componentes de UI reutilizables.
   Solo presentan datos: los cálculos vienen del backend.
   ========================================================= */

const UI = (function () {
  const moneyFmt = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    wallet: '<path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5"/><path d="M17 14h.01"/>',
    pie: '<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    filter: '<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
    up: '<path d="m18 15-6-6-6 6"/>',
    down: '<path d="m6 9 6 6 6-6"/>'
  };

  const PALETTE = ['#0f766e', '#6366f1', '#f59e0b', '#ec4899', '#0ea5e9', '#84cc16',
    '#a855f7', '#ef4444', '#14b8a6', '#f97316', '#64748b', '#22c55e'];
  let groupColors = {};

  function icon(name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  /** Reemplaza elementos con data-icon por su SVG (respetando el texto existente). */
  function hydrateIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      if (el.dataset.iconDone) return;
      el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon));
      el.dataset.iconDone = '1';
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function money(n, opts) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '−' : (opts && opts.plus && n > 0 ? '+' : '');
    return sign + 'S/ ' + moneyFmt.format(Math.abs(n));
  }

  function percent(n, digits) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toFixed(digits === undefined ? 1 : digits) + '%';
  }

  /** Asigna colores estables por grupo (mismo color en todos los gráficos). */
  function setGroups(groups) {
    groupColors = {};
    groups.forEach(function (g, i) { groupColors[g] = PALETTE[i % PALETTE.length]; });
  }
  function colorFor(group) {
    if (!groupColors[group]) {
      groupColors[group] = PALETTE[Object.keys(groupColors).length % PALETTE.length];
    }
    return groupColors[group];
  }

  function initials(s) {
    const t = String(s || '?').trim();
    return esc(t.slice(0, 2).toUpperCase());
  }

  /**
   * Píldora de variación. higherIsGood define si subir es positivo (ingresos) o negativo (gastos).
   */
  function delta(change, higherIsGood, suffix) {
    if (!change || change.deltaPct === null || change.deltaPct === undefined) {
      if (change && change.delta !== null && change.delta !== undefined && suffix === 'pp') {
        return deltaPill(change.delta, higherIsGood, ' pp');
      }
      return '<span class="delta neutral">sin comparación</span>';
    }
    return deltaPill(change.deltaPct, higherIsGood, '%');
  }
  function deltaPill(value, higherIsGood, unit) {
    if (Math.abs(value) < 0.05) return '<span class="delta neutral">0' + unit + '</span>';
    const up = value > 0;
    const good = higherIsGood ? up : !up;
    return '<span class="delta ' + (good ? 'good' : 'bad') + '">' + icon(up ? 'up' : 'down') .replace('<svg ', '<svg width="11" height="11" ') +
      Math.abs(value).toFixed(1) + unit + '</span>';
  }

  function kpiCard(o) {
    return '<div class="card kpi ' + (o.cls || '') + '">' +
      '<div class="kpi-label">' + (o.color ? '<span class="kpi-dot" style="background:' + o.color + '"></span>' : '') + esc(o.label) + '</div>' +
      '<div class="kpi-value num ' + (o.valueCls || '') + '">' + o.value + '</div>' +
      '<div class="kpi-foot">' + (o.foot || '') + '</div></div>';
  }

  function kpiSkeleton(n) {
    let html = '';
    for (let i = 0; i < n; i++) {
      html += '<div class="card"><div class="skeleton sk-line" style="width:45%"></div>' +
        '<div class="skeleton sk-value"></div><div class="skeleton sk-line" style="width:60%"></div></div>';
    }
    return html;
  }

  function blockSkeleton() { return '<div class="skeleton sk-block"></div>'; }

  function empty(title, text, iconName) {
    return '<div class="empty">' + icon(iconName || 'inbox') +
      '<div class="empty-title">' + esc(title) + '</div><div>' + esc(text || '') + '</div></div>';
  }

  function progressBar(pctValue, estado, markerPct) {
    const w = Math.max(0, Math.min(100, pctValue || 0));
    return '<div class="bar"><div class="bar-fill ' + (estado || '') + '" style="width:' + w + '%"></div>' +
      (markerPct ? '<div class="bar-marker" style="left:' + Math.min(100, markerPct) + '%" title="Avance del mes"></div>' : '') +
      '</div>';
  }

  const STATUS_LABEL = {
    ok: 'En rango', advertencia: 'Cerca del límite', excedido: 'Excedido',
    pagado: 'Pagado', pendiente: 'Pendiente', vencido: 'Sin registrar'
  };

  function badge(estado, text) {
    return '<span class="badge ' + estado + '">' + esc(text || STATUS_LABEL[estado] || estado) + '</span>';
  }

  /** Fila de presupuesto (categoría o grupo). */
  function budgetRow(item, name, extra, marker) {
    const remaining = item.disponible >= 0
      ? 'Quedan ' + money(item.disponible)
      : '<span class="text-danger">Excedido ' + money(-item.disponible) + '</span>';
    return '<div class="budget-row">' +
      '<div class="budget-top"><div class="budget-name">' + name + '</div>' +
      '<div class="budget-amounts num">' + money(item.gastado) + ' / ' + money(item.presupuesto) + '</div></div>' +
      progressBar(item.pct, item.estado, marker) +
      '<div class="budget-bottom"><span>' + percent(item.pct, 0) + (extra || '') + '</span><span>' + remaining + '</span></div>' +
      '</div>';
  }

  function alertItem(a) {
    const ic = a.level === 'info' ? 'info' : 'alert';
    return '<button class="alert ' + a.level + '" data-goto="' + esc(a.view) + '">' +
      '<div class="alert-icon">' + icon(ic) + '</div>' +
      '<div><div class="alert-title">' + esc(a.title) + '</div><div class="alert-detail">' + esc(a.detail) + '</div></div></button>';
  }

  /** Fila de movimiento para listas (y tabla en móvil). */
  function movementRow(m) {
    const sign = m.tipo === 'ingreso' ? 1 : m.tipo === 'gasto' ? -1 : 0;
    const cls = sign > 0 ? 'amount-in' : sign < 0 ? 'amount-out' : 'amount-neutral';
    const color = m.grupo ? colorFor(m.grupo) : '#64748b';
    const title = m.categoria || m.tipoLabel;
    const sub = [m.fechaTexto, m.descripcion || m.grupo || m.tipoLabel, m.medio].filter(Boolean).join(' · ');
    return '<div class="list-row" data-mov="' + m.id + '" style="cursor:pointer">' +
      '<div class="list-icon" style="background:' + color + '1f;color:' + color + '">' + initials(title) + '</div>' +
      '<div class="list-main"><div class="list-title">' + esc(title) + '</div><div class="list-sub">' + esc(sub) + '</div></div>' +
      '<div class="list-amount num ' + cls + '">' + (sign > 0 ? '+' : sign < 0 ? '−' : '') + money(m.monto).replace('−', '') + '</div></div>';
  }

  function legend(items) {
    return '<div class="legend">' + items.map(function (it) {
      return '<div class="legend-row"><span class="legend-swatch" style="background:' + it.color + '"></span>' +
        '<span class="legend-name">' + esc(it.name) + '</span><span class="legend-val num">' + money(it.total) + '</span>' +
        '<span class="legend-pct num">' + percent(it.share, 0) + '</span></div>';
    }).join('') + '</div>';
  }

  function statRow(label, value, cls) {
    return '<div class="stat-row ' + (cls || '') + '"><span>' + label + '</span><span class="num">' + value + '</span></div>';
  }

  return {
    icon: icon, hydrateIcons: hydrateIcons, esc: esc, money: money, percent: percent,
    setGroups: setGroups, colorFor: colorFor, delta: delta, kpiCard: kpiCard, kpiSkeleton: kpiSkeleton,
    blockSkeleton: blockSkeleton, empty: empty, progressBar: progressBar, badge: badge, budgetRow: budgetRow,
    alertItem: alertItem, movementRow: movementRow, legend: legend, statRow: statRow, initials: initials
  };
})();
</script>
